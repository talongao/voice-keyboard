[package]
name = "voice-keyboard"
version = "0.1.16"
edition = "2021"
description = "手机当远程键盘：文字直接插进电脑光标"
license = "MIT"
repository = "https://gitee.com/talonGao/voice-keyboard"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.25.1"
# 只为在崩溃/启动失败时弹个对话框：双击启动的程序，控制台一关就什么线索都没了。
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS 上托盘（NSStatusItem）要有 NSApplication 在跑，否则图标根本不出来。
# 我们只要 NSApplication 这一个类，所以只开这一条特性。
tray-icon = "0.25.1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication"] }

[target.'cfg(unix)'.dependencies]
# 只为了把 SIGPIPE 恢复成默认行为（见 main.rs）：不然 `--status | head`
# 这种用法会让 println! 拿到 Broken pipe 然后 panic，看着像崩了。
libc = "0.2"

[dependencies]
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
enigo = "0.6"
# 只要二维码矩阵，不要它自带的 PNG 渲染（那会把 image 拖进来）
qrcode = { version = "0.14", default-features = false }
# 只用它的文本剪贴板：关掉默认特性，免得把 image（带 SIMD 解码）拖进来
arboard = { version = "3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
# 自签证书：麦克风模式必须要 HTTPS（浏览器只在安全上下文给麦克风）
rcgen = "0.13"

[[bin]]
name = "voice-keyboard"
path = "src/main.rs"

# 体积优化：默认 release 是"跑得快"，这里是"小"
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# 音频输出只 Windows/macOS 需要（Linux 用 pacat 管子，不引依赖）
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
cpal = "0.15"
