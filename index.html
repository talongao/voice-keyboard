<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<title>语音键盘</title>
<style>
  :root{
    --bg:#0f1115; --surface:#171b23; --surface2:#1e2330; --border:#242a36;
    --text:#e8eaf0; --muted:#8b94a7; --accent:#4c8dff; --ok:#3ddc84; --err:#ff5f56;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; height:100dvh;
    overscroll-behavior:none;
  }

  /* ---------- 顶栏 ---------- */
  header{
    display:flex; align-items:center; gap:9px;
    padding:calc(11px + var(--safe-t)) 16px 11px;
    border-bottom:1px solid var(--border); flex:0 0 auto;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:0 0 auto}
  .dot.on{background:var(--ok);box-shadow:0 0 0 0 rgba(61,220,132,.55);animation:pulse 2.4s infinite}
  .dot.off{background:var(--err)}
  @keyframes pulse{70%{box-shadow:0 0 0 7px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
  header .name{font-size:13px;font-weight:600;letter-spacing:.3px}
  header .addr{font-size:11.5px;color:var(--muted);margin-left:auto;
    max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- 主体 ---------- */
  main{flex:1 1 auto;display:flex;flex-direction:column;padding:12px;gap:10px;min-height:0}
  textarea{
    flex:1 1 auto; width:100%; min-height:0; resize:none;
    background:var(--surface); color:var(--text);
    border:1px solid var(--border); border-radius:16px;
    padding:15px; font:inherit; font-size:17px; line-height:1.6;
    outline:none; transition:border-color .15s; overscroll-behavior:contain;
  }
  textarea:focus{border-color:#33415c}
  textarea::placeholder{color:#5a6377}

  /* ---------- chips ---------- */
  .chips{display:flex;gap:8px;flex-wrap:wrap;flex:0 0 auto}
  .chip{
    display:flex;align-items:center;gap:7px;
    padding:8px 13px;border-radius:11px;
    background:var(--surface);border:1px solid var(--border);
    font-size:13.5px;color:var(--muted);cursor:pointer;user-select:none;
    transition:.15s;
  }
  .chip .knob{
    width:14px;height:14px;border-radius:50%;
    background:#39404f;transition:.15s;flex:0 0 auto;
  }
  .chip.on{color:var(--text);border-color:#31405c;background:var(--surface2)}
  .chip.on .knob{background:var(--accent);box-shadow:0 0 7px rgba(76,141,255,.6)}

  /* ---------- 滚轮摇杆 ---------- */
  /* 跟手机游戏的摇杆一个意思：拖住不放，往哪个方向偏就往哪边滚。 */
  .stick-row{display:flex;align-items:center;gap:14px;flex:0 0 auto}
  .stick-row.hide{display:none}
  .stick{
    position:relative;flex:0 0 auto;
    -webkit-touch-callout:none;
    width:132px;height:132px;border-radius:50%;
    background:radial-gradient(circle at 50% 42%, #232a38 0%, var(--surface) 72%);
    border:1px solid var(--border);
    box-shadow:inset 0 6px 18px rgba(0,0,0,.45);
    touch-action:none;
  }
  /* 十字准星：让“能上下也能左右”这件事一眼看出来 */
  .stick::before,.stick::after{
    content:"";position:absolute;background:#252c3a;
  }
  .stick::before{left:50%;top:12px;bottom:12px;width:1px;transform:translateX(-50%)}
  .stick::after{top:50%;left:12px;right:12px;height:1px;transform:translateY(-50%)}
  .stick .arrows{position:absolute;inset:0;font-size:12px;color:#3b4456;pointer-events:none}
  .stick .arrows i{position:absolute;font-style:normal}
  .stick .arrows .up{left:50%;top:6px;transform:translateX(-50%)}
  .stick .arrows .down{left:50%;bottom:6px;transform:translateX(-50%)}
  .stick .arrows .left{left:8px;top:50%;transform:translateY(-50%)}
  .stick .arrows .right{right:8px;top:50%;transform:translateY(-50%)}
  .knob-stick{
    position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;
    margin:-28px 0 0 -28px;
    background:linear-gradient(180deg,#5b96ff,#3f7ae6);
    box-shadow:0 6px 16px -4px rgba(76,141,255,.8), inset 0 1px 0 rgba(255,255,255,.35);
    transition:transform .08s ease-out, box-shadow .15s;
    display:flex;align-items:center;justify-content:center;
    font-size:19px;color:rgba(255,255,255,.9);
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  }
  .stick.act .knob-stick{transition:none;box-shadow:0 0 0 8px rgba(76,141,255,.16), 0 6px 16px -4px rgba(76,141,255,.9)}
  .stick-tip{flex:1 1 auto;min-width:0;font-size:12.5px;color:var(--muted);line-height:1.7}
  .stick-tip b{color:var(--text);font-weight:600}

  /* ---------- 电脑端按键 ---------- */
  /* 「发送后回车」关掉之后，手机端还要有办法让电脑回车——不然就没辙了 */
  .keys{display:flex;gap:8px;flex:0 0 auto}
  .key{
    flex:1 1 0;height:44px;border-radius:12px;
    background:var(--surface);border:1px solid var(--border);
    color:var(--text);font-size:15px;font-weight:600;
    display:flex;align-items:center;justify-content:center;gap:6px;
    cursor:pointer;user-select:none;-webkit-user-select:none;
    transition:.12s;
  }
  .key:active{transform:scale(.97);border-color:#31405c;background:var(--surface2)}
  .key.hot{border-color:#31405c;color:#cfe0ff}
  .key.act{transform:scale(.97);border-color:var(--accent);background:var(--surface2)}
  .key small{font-weight:400;font-size:11px;color:var(--muted)}

  /* ---------- 按钮 ---------- */
  .actions{display:flex;gap:10px;flex:0 0 auto}
  button{
    font:inherit;font-weight:600;border:0;border-radius:14px;
    padding:0 18px;height:56px;cursor:pointer;transition:.12s;
  }
  button:active{transform:scale(.978)}
  #send{flex:1 1 auto;background:var(--accent);color:#fff;font-size:17px;
    box-shadow:0 4px 18px -6px rgba(76,141,255,.75)}
  #send:disabled{background:#2a3140;color:#5a6377;box-shadow:none}
  #undo{flex:0 0 auto;background:var(--surface);color:var(--muted);
    border:1px solid var(--border);font-size:14.5px}
  #undo:disabled{opacity:.38}

  /* ---------- 配对门 ---------- */
  .gate{
    position:fixed;inset:0;background:var(--bg);
    display:flex;align-items:center;justify-content:center;padding:24px;z-index:20;
  }
  .gate.hide{display:none}
  .card{width:100%;max-width:330px;text-align:center}
  .card h1{font-size:20px;margin:0 0 6px;font-weight:650}
  .card p{color:var(--muted);font-size:13.5px;margin:0 0 22px;line-height:1.6}
  .card input{
    width:100%;height:58px;text-align:center;
    font:600 26px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.32em;text-indent:.32em;
    background:var(--surface);color:var(--text);
    border:1px solid var(--border);border-radius:14px;outline:none;margin-bottom:12px;
  }
  .card input:focus{border-color:var(--accent)}
  .card button{width:100%;background:var(--accent);color:#fff;font-size:16px}
  .card .err{color:var(--err);font-size:13px;min-height:19px;margin-top:12px}

  /* ---------- toast ---------- */
  /* 提示条要浮在 chips 上方：92px 正好压在「停顿自动发送」那颗按钮上 */
  #toast{
    position:fixed;left:50%;bottom:calc(126px + var(--safe-b));transform:translate(-50%,14px);
    background:#232a38;border:1px solid #2f3949;color:var(--text);
    padding:10px 18px;border-radius:12px;font-size:14px;
    opacity:0;pointer-events:none;transition:.22s;z-index:30;
    max-width:88vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.bad{background:#3a1f22;border-color:#5c2a2f;color:#ffb3ae}

  /* 通用隐藏：页面里原来只有 .gate.hide / .stick-row.hide 这种针对具体元素的写法，
     新增的面板与弹窗用不了，所以补一条通用的 */
  .hide{display:none !important}

  /* 标签栏 */
  .tabs{display:flex;gap:8px;margin:0 0 12px}
  .tab{
    flex:1 1 0;height:38px;border-radius:10px;cursor:pointer;font:inherit;font-size:14px;
    background:var(--surface2,#1b2029);color:var(--muted);border:1px solid var(--border,#242a36);
    transition:.15s;
  }
  .tab.on{color:#fff;background:var(--accent,#3b82f6);border-color:transparent;font-weight:600}

  /* 麦克风面板 */
  .mic-head{margin:2px 0 14px}
  .mic-title{font-size:15px;font-weight:600}
  .mic-sub{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.55;word-break:break-all}
  .mic-btn{
    height:150px;border-radius:18px;display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:600;user-select:none;-webkit-user-select:none;cursor:pointer;
    background:var(--surface2,#1b2029);border:1px solid var(--border,#242a36);
    transition:.15s;touch-action:manipulation;
  }
  .mic-btn.on{background:#7f1d1d;border-color:#b91c1c;color:#fff}
  .mic-btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
  .meter{height:8px;border-radius:5px;background:#1b2029;overflow:hidden;margin:14px 0 0}
  .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22c55e,#eab308,#ef4444);
    transition:width .08s linear}
  .mic-note{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.6}
  .mic-ask{margin-top:16px;background:#161b23;border:1px solid #2a3140;border-radius:14px;padding:16px}
  .mic-ask-txt{font-size:13.5px;line-height:1.65;margin-bottom:14px}
  .mic-ask-btns{display:flex;gap:10px}
  .mic-ask-btns button{
    flex:1 1 0;height:42px;border-radius:11px;cursor:pointer;font:inherit;font-size:14px;
    background:var(--accent,#3b82f6);color:#fff;border:0;
  }
  .mic-ask-btns button.ghost{background:transparent;color:var(--muted);border:1px solid #2a3140}
  .mic-steps{margin-top:16px;display:flex;flex-direction:column;gap:12px}
  .step{background:#161b23;border:1px solid #2a3140;border-radius:14px;padding:14px}
  .step .st{font-size:13.5px;font-weight:600;margin-bottom:6px}
  .step .sd{font-size:12.5px;color:var(--muted);line-height:1.65}
  .step code{display:block;margin-top:8px;background:#0f1319;border:1px solid #2a3140;border-radius:8px;
    padding:8px 10px;font-size:12px;color:#8ab4f8;word-break:break-all}
  .step .sact{margin-top:10px;display:flex;gap:8px}
  .step .sact button{
    flex:1 1 0;height:38px;border-radius:10px;cursor:pointer;font:inherit;font-size:13.5px;
    background:var(--accent,#3b82f6);color:#fff;border:0;
  }
  .step .sact a{
    flex:1 1 0;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-size:13.5px;background:#1b2029;color:#8ab4f8;border:1px solid #2a3140;text-decoration:none;
  }
  .step.done{opacity:.55}
</style>
</head>
<body>

<header>
  <span class="dot" id="dot"></span>
  <span class="name" id="status">连接中…</span>
  <span class="addr" id="addr"></span>
</header>

<nav class="tabs">
  <button class="tab on" id="tab-text">文字</button>
  <button class="tab" id="tab-mic">麦克风</button>
</nav>

<main id="panel-text">
  <textarea id="ta" placeholder="点这里，用键盘上的 🎤 说话，或直接打字" autocomplete="off"
            autocapitalize="sentences" spellcheck="false"></textarea>

  <div class="stick-row hide" id="stick-row">
    <div class="stick" id="stick">
      <div class="arrows">
        <i class="up">▲</i><i class="down">▼</i><i class="left">◀</i><i class="right">▶</i>
      </div>
      <div class="knob-stick" id="knob-stick">⇅</div>
    </div>
    <div class="stick-tip">
      <b>拖住摇杆</b><br>
      按住往上下 / 左右拖，电脑那边就跟着滚。松手停。
    </div>
  </div>

  <div class="chips">
    <div class="chip" id="c-stick"><span class="knob"></span>摇杆</div>
  </div>

  <div class="keys">
    <div class="key hot" id="k-enter">↵ 回车</div>
    <div class="key" id="k-backspace">⌫ 退格</div>
  </div>

  <div class="actions">
    <button id="send">发送</button>
    <button id="undo" disabled>重来</button>
  </div>
</main>

<main id="panel-mic" class="hide">
  <div class="mic-head">
    <div class="mic-title" id="mic-state">检测中…</div>
    <div class="mic-sub" id="mic-sub"></div>
  </div>

  <div class="mic-btn" id="mic-btn" aria-disabled="true">
    <span id="mic-btn-txt">开始</span>
  </div>

  <div class="meter"><i id="meter-bar"></i></div>

  <div class="mic-note" id="mic-note"></div>

  <div class="mic-ask hide" id="mic-ask">
    <div class="mic-ask-txt" id="mic-ask-txt"></div>
    <div class="mic-ask-btns">
      <button id="mic-guide-yes">在电脑上打开引导</button>
      <button id="mic-guide-no" class="ghost">重新检测</button>
    </div>
  </div>

  <div class="mic-steps hide" id="mic-steps"></div>
</main>

<div class="gate hide" id="gate">
  <div class="card">
    <h1>语音键盘</h1>
    <p>输入电脑上显示的 6 位配对码<br>（扫二维码就不用输）</p>
    <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="······">
    <button id="pair">连接</button>
    <div class="err" id="gate-err"></div>
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const ta = $("#ta"), sendBtn = $("#send"), undoBtn = $("#undo");
  const gate = $("#gate"), pinEl = $("#pin"), gateErr = $("#gate-err");
  const dot = $("#dot"), statusEl = $("#status"), addrEl = $("#addr");
  const cStick = $("#c-stick");

  const LS = {
    get(k, d) { try { const v = localStorage.getItem("vk_" + k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("vk_" + k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem("vk_" + k); } catch (e) {} },
  };

  let token = LS.get("token", "");
  const wantTab = LS.get("tab", "text");
  let base = LS.get("base", location.origin);
  let endpoints = [];
  try { endpoints = JSON.parse(LS.get("endpoints", "[]")); } catch (e) { endpoints = []; }
  // 「发送后回车」由电脑端那个开关说了算——手机上再放一个只会互相打架
  // （服务端是「两边都为真才回车」，PC 端一关手机端那个就白点了）。
  // 手机端要单独回车，用下面那颗「回车」键。
  let optStick = LS.get("stick", "1") === "1";
  let lastSent = null;

  /* ---------------- 请求：自动在多地址间降级 ---------------- */
  // 默认 POST（pair/send/undo 都是 POST）；读接口用 api.get()。
  // 注意：这里必须区分动词，不然 GET-only 的 /api/endpoints 会 404。
  async function api(path, body, method) {
    const verb = method || "POST";
    const list = [base].concat(endpoints.filter((e) => e !== base));
    let lastErr = null;
    for (const b of list) {
      try {
        const r = await fetch(b + path, {
          method: verb,
          headers: Object.assign(
            { "Content-Type": "application/json" },
            token ? { Authorization: "Bearer " + token } : {}
          ),
          body: verb === "GET" ? undefined : JSON.stringify(body || {}),
        });
        if (r.status === 401) { unpair(); throw new Error("配对已失效，请重新扫二维码"); }
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
        if (b !== base) { base = b; LS.set("base", b); paintAddr(); }
        return j;
      } catch (e) {
        if (/配对已失效/.test(e.message)) throw e;
        lastErr = e;
      }
    }
    throw lastErr || new Error("连不上电脑");
  }

  api.get = (path) => api(path, undefined, "GET");

  async function loadEndpoints() {
    try {
      const j = await api.get("/api/endpoints");
      if (Array.isArray(j.endpoints) && j.endpoints.length) {
        endpoints = j.endpoints;
        LS.set("endpoints", JSON.stringify(endpoints));
        paintAddr();
      }
    } catch (e) { /* 拿不到就先用当前的 */ }
  }

  /* ---------------- 配对 ---------------- */
  async function pair(cred) {
    const r = await fetch(base + "/api/pair", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(cred),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "配对失败");
    token = j.token || "";
    LS.set("token", token);
    LS.set("base", base);
  }

  function unpair() {
    token = "";
    LS.del("token");
    gate.classList.remove("hide");
    dot.className = "dot off";
    statusEl.textContent = "未连接";
  }

  /* ---------------- 滚轮摇杆 ---------------- */
  // 手势：按住不放 → 摇杆偏多少就滚多快；松手回中、停止。
  // 方向跟鼠标滚轮一致：往上拖 = 往上滚（内容往下走）。
  const stickEl = $("#stick"), knobStick = $("#knob-stick"), stickRow = $("#stick-row");
  const STICK_R = 38;      // 摇杆最大位移（px）
  const STICK_DEAD = 0.22; // 死区：手抖不动
  const STICK_TICK = 70;   // 发送间隔（ms）
  let stickPointer = null;
  let stickTimer = null;
  let stickBusy = false;
  let stickVec = { x: 0, y: 0 };

  function stickPaint(x, y) {
    knobStick.style.transform = "translate(" + x + "px," + y + "px)";
  }

  function stickTrack(e) {
    const r = stickEl.getBoundingClientRect();
    let x = e.clientX - (r.left + r.width / 2);
    let y = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(x, y);
    if (len > STICK_R) { x = x / len * STICK_R; y = y / len * STICK_R; }
    stickPaint(x, y);
    stickVec = { x: x / STICK_R, y: y / STICK_R };
  }

  // 带死区判断，并把幅度换成「滚轮格数」：偏一点点滚 1 格，推到底滚 2 格
  function stickNotch(v) {
    if (Math.abs(v) < STICK_DEAD) return 0;
    return Math.sign(v) * Math.max(1, Math.round(Math.abs(v) * 2));
  }

  async function stickTick() {
    const dx = stickNotch(stickVec.x), dy = stickNotch(stickVec.y);
    if (!dx && !dy) return;
    if (stickBusy) return; // 上一发还没回来就别堆了
    stickBusy = true;
    try {
      await api("/api/scroll", { dx: dx, dy: dy });
    } catch (e) {
      dot.className = "dot off";
      statusEl.textContent = "滚动失败";
    } finally {
      stickBusy = false;
    }
  }

  function stickEnd() {
    if (stickPointer === null) return;
    stickPointer = null;
    if (stickTimer) { clearInterval(stickTimer); stickTimer = null; }
    stickVec = { x: 0, y: 0 };
    stickEl.classList.remove("act");
    stickPaint(0, 0);
  }

  stickEl.addEventListener("pointerdown", (e) => {
    stickPointer = e.pointerId;
    try { stickEl.setPointerCapture(e.pointerId); } catch (err) {}
    stickEl.classList.add("act");
    stickTrack(e);
    if (stickTimer) clearInterval(stickTimer);
    stickTimer = setInterval(stickTick, STICK_TICK);
    e.preventDefault();
  });
  stickEl.addEventListener("pointermove", (e) => {
    if (e.pointerId === stickPointer) stickTrack(e);
  });
  stickEl.addEventListener("pointerup", stickEnd);
  stickEl.addEventListener("pointercancel", stickEnd);
  // 手指从摇杆上滑出去也要停（指针捕获一般情况下管得住，这条是保险）
  window.addEventListener("blur", stickEnd);

  /* ---------------- UI ---------------- */
  function paintAddr() {
    addrEl.textContent = base.replace(/^https?:\/\//, "");
  }

  function paintChips() {
    cStick.classList.toggle("on", optStick);
    stickRow.classList.toggle("hide", !optStick);
    if (!optStick) stickEnd();
  }

  let toastTimer = null;
  function flash(msg, bad) {
    const t = $("#toast");
    t.textContent = msg;
    t.className = "show" + (bad ? " bad" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = ""; }, 1900);
  }

  function updateUndo() {
    const ok = lastSent && Date.now() - lastSent.at < 60000;
    undoBtn.disabled = !ok;
  }

  /* ---------------- 动作 ---------------- */
  async function send() {
    const text = ta.value;
    if (!text.trim()) { flash("还没输入内容"); return; }
    sendBtn.disabled = true;
    try {
      // enter: true = 「我要回车」，但真正敲不敲由电脑端那个开关定；
      // 返回里的 enter 才是实际发生的情况，撤销时按它退。
      const j = await api("/api/send", { text: text, enter: true });
      lastSent = {
        text: text,
        chars: j.chars || [...text].length,
        enter: j.enter !== false,
        at: Date.now(),
      };
      updateUndo();
      ta.value = "";
      ta.focus();
      dot.className = "dot on";
      statusEl.textContent = "已连接";
      flash("已插入 " + j.chars + " 字");
    } catch (e) {
      dot.className = "dot off";
      statusEl.textContent = "发送失败";
      flash(e.message, true);
    } finally {
      sendBtn.disabled = false;
    }
  }

  async function undo() {
    if (!lastSent) return;
    if (Date.now() - lastSent.at > 60000) { flash("超过 60 秒，不能重来了", true); updateUndo(); return; }
    try {
      await api("/api/undo", { chars: lastSent.chars, enter: lastSent.enter });
      ta.value = lastSent.text;
      lastSent = null;
      updateUndo();
      ta.focus();
      flash("已退回，改完再发");
    } catch (e) {
      flash(e.message, true);
    }
  }

  /* ---------------- 电脑端按键 ---------------- */
  // 单独的按键：跟文字分开走，/api/key。最常见的就是回车——
  // 「发送后回车」关着的时候，全靠它把内容送出去。
  async function pressKey(name, el) {
    if (el) { el.classList.add("act"); setTimeout(() => el.classList.remove("act"), 120); }
    try {
      await api("/api/key", { key: name });
      dot.className = "dot on";
      statusEl.textContent = "已连接";
    } catch (e) {
      dot.className = "dot off";
      statusEl.textContent = "按键失败";
      flash(e.message, true);
    }
  }

  /* ---------------- 事件 ---------------- */
  sendBtn.addEventListener("click", send);
  undoBtn.addEventListener("click", undo);

  const kEnter = $("#k-enter"), kBack = $("#k-backspace");
  kEnter.addEventListener("click", () => pressKey("enter", kEnter));
  kBack.addEventListener("click", () => pressKey("backspace", kBack));
  // 长按退格 = 连删（改错字的时候省事）
  let backTimer = null;
  const backStart = (e) => {
    e.preventDefault();
    backTimer = setInterval(() => pressKey("backspace", null), 120);
  };
  const backStop = () => { if (backTimer) { clearInterval(backTimer); backTimer = null; } };
  kBack.addEventListener("pointerdown", backStart);
  kBack.addEventListener("pointerup", backStop);
  kBack.addEventListener("pointercancel", backStop);
  kBack.addEventListener("pointerleave", backStop);

  cStick.addEventListener("click", () => {
    optStick = !optStick; LS.set("stick", optStick ? "1" : "0"); paintChips();
    flash(optStick ? "滚轮摇杆已打开" : "滚轮摇杆已收起");
  });

  ta.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); send(); }
  });

  $("#pair").addEventListener("click", async () => {
    const pin = (pinEl.value || "").trim();
    if (pin.length < 4) { gateErr.textContent = "请输入完整配对码"; return; }
    gateErr.textContent = "";
    try {
      await pair({ pin: pin });
      gate.classList.add("hide");
      dot.className = "dot on";
      statusEl.textContent = "已连接";
      loadEndpoints();
      ta.focus();
      flash("配对成功");
    } catch (e) {
      gateErr.textContent = e.message;
      pinEl.value = "";
      pinEl.focus();
    }
  });

  pinEl.addEventListener("input", () => {
    if (pinEl.value.length === 6) $("#pair").click();
  });

  setInterval(updateUndo, 3000);

  /* ---------------- 启动 ---------------- */
  (async function init() {
    paintChips();
    paintAddr();

    // 二维码里带长密钥（k=），看不到码时也能手输 6 位 PIN
    const hk = location.hash.match(/k=([A-Za-z0-9_\-]+)/);
    const hp = location.hash.match(/pin=(\d{4,8})/);
    if (hk || hp) {
      history.replaceState(null, "", location.pathname + location.search);
      try {
        await pair(hk ? { k: hk[1] } : { pin: hp[1] });
        flash("配对成功");
      } catch (e) {
        gateErr.textContent = e.message;
        gate.classList.remove("hide");
        return;
      }
    }

    if (!token) {
      try {
        const info = await (await fetch(base + "/api/info")).json();
        if (info.need_auth) {
          gate.classList.remove("hide");
          dot.className = "dot off";
          statusEl.textContent = "未连接";
          pinEl.focus();
          return;
        }
      } catch (e) {
        gateErr.textContent = "连不上电脑，检查是否同一网络";
        gate.classList.remove("hide");
        return;
      }
    }

    gate.classList.add("hide");
    try {
      await api.get("/api/endpoints");
      dot.className = "dot on";
      statusEl.textContent = "已连接";
    } catch (e) {
      dot.className = "dot off";
      statusEl.textContent = "连接异常";
    }

  // ══ 麦克风模式 ═══════════════════════════════════════════════
  // 双线：这条线把手机当麦克风用（音频直传），另一条线是发文字。
  // 开麦前必须先过两道门：① 页面得是 https（浏览器规矩）② 电脑上得有虚拟声卡。
  // 缺哪个就弹窗问用户"要不要引导"，点了才一步步教。
  const tabText = $("#tab-text"), tabMic = $("#tab-mic");
  const panelText = $("#panel-text"), panelMic = $("#panel-mic");
  const micState = $("#mic-state"), micSub = $("#mic-sub"), micNote = $("#mic-note");
  const micBtn = $("#mic-btn"), micBtnTxt = $("#mic-btn-txt"), meterBar = $("#meter-bar");
  const micAsk = $("#mic-ask"), micAskTxt = $("#mic-ask-txt"), micSteps = $("#mic-steps");

  let micReady = false, recording = false, sending = 0;
  let audioCtx = null, micStream = null, workletNode = null;

  function showTab(which) {
    const mic = which === "mic";
    tabText.classList.toggle("on", !mic);
    tabMic.classList.toggle("on", mic);
    panelText.classList.toggle("hide", mic);
    panelMic.classList.toggle("hide", !mic);
    LS.set("tab", which);
    if (mic) micPrepare();
    else micStopQuiet();
  }
  tabText.addEventListener("click", () => showTab("text"));
  tabMic.addEventListener("click", () => showTab("mic"));

  function micSetReady(on) {
    micReady = on;
    micBtn.setAttribute("aria-disabled", on ? "false" : "true");
  }

  async function micPrepare() {
    micSetReady(false);
    micAsk.classList.add("hide");
    micSteps.classList.add("hide");
    micSteps.innerHTML = "";
    micState.textContent = "检测中…";
    micSub.textContent = "";
    micNote.textContent = "";

    let st = null;
    try { st = await api.get("/api/mic/status"); } catch (e) { /* 服务可能没起来 */ }

    const secure = window.isSecureContext;

    // 情况一：页面还是 http。浏览器不给麦克风，而且这时候多半服务端也没证书。
    if (!secure) {
      if (st && st.tls) {
        // 服务端已经有证书了：手机这边只要换成 https 重开一次
        micState.textContent = "需要改用 HTTPS";
        micSub.textContent = "电脑端已启用 HTTPS。请以 https 重新打开本页并重新配对，"
          + "首次需手动信任一次证书（iOS：安装描述文件后在「关于本机 → 证书信任设置」启用；"
          + "Android：安装用户 CA）。";
        showHttpsButton();
        return;
      }
      micState.textContent = "尚未就绪";
      micSub.textContent = "需要通过 HTTPS 访问本页。浏览器仅在 https 下允许网页使用麦克风，"
        + "这一步需要在电脑上完成设置。";
      askOnPc("需要在电脑端生成并信任 HTTPS 证书。");
      return;
    }

    if (!st) {
      micState.textContent = "连接异常";
      micSub.textContent = "无法连接电脑端服务。";
      return;
    }

    // 情况二：https 了，但电脑上缺虚拟声卡（Windows / macOS 常见）
    if (!st.ok) {
      micState.textContent = "尚未就绪";
      micSub.textContent = st.reason || "电脑上还未准备好虚拟麦克风。";
      askOnPc(st.reason || "需要在电脑上安装虚拟声卡。");
      return;
    }

    // 情况三：齐活
    micSetReady(true);
    micState.textContent = "准备就绪";
    micSub.textContent = "设备：" + (st.device || "虚拟麦克风")
      + (st.tls ? " · 已启用 HTTPS" : "");
    micNote.textContent = "点击上方按钮开始采集。采集期间请保持本页面在前台："
      + "息屏或切换到其他应用时，浏览器会暂停录音。";
    micBtnTxt.textContent = "开始";
  }

  // 需要电脑上动手：说明原因，并给"请电脑弹出引导"的按钮
  function askOnPc(reason) {
    micNote.textContent = "";
    micAsk.classList.remove("hide");
    micAskTxt.textContent = "麦克风模式需要在电脑上完成设置：" + reason
      + " 点击下方按钮，电脑端会弹出引导页面（装驱动、生成证书都在电脑上做，手机上做不了）。";
    micBtnTxt.textContent = "开始";
  }

  function showHttpsButton() {
    micSteps.classList.remove("hide");
    micSteps.innerHTML = "";
    const box = document.createElement("div");
    box.className = "step";
    const t = document.createElement("div");
    t.className = "st";
    t.textContent = "以 HTTPS 重新打开";
    const d = document.createElement("div");
    d.className = "sd";
    d.textContent = "会带上当前配对信息，重新打开后无需再输配对码。";
    const act = document.createElement("div");
    act.className = "sact";
    const go = document.createElement("button");
    go.textContent = "以 HTTPS 重新打开";
    go.addEventListener("click", () => {
      location.href = location.href.replace(/^http:/, "https:");
    });
    act.appendChild(go);
    box.append(t, d, act);
    micSteps.appendChild(box);
  }

  $("#mic-guide-no").addEventListener("click", micPrepare); // 「重新检测」

  $("#mic-guide-yes").addEventListener("click", async () => {
    let r = null;
    try { r = await api("/api/mic/guide-open", {}, "POST"); } catch (e) {}
    micAsk.classList.add("hide");
    micSteps.classList.remove("hide");
    micSteps.innerHTML = "";
    const box = document.createElement("div");
    box.className = "step";
    const t = document.createElement("div");
    t.className = "st";
    t.textContent = r && r.ok ? "已请电脑打开引导" : "请电脑打开引导失败";
    const d = document.createElement("div");
    d.className = "sd";
    d.textContent = r && r.ok
      ? "请在电脑上按引导操作（安装驱动、生成证书）。完成后回到本页点「重新检测」。"
      : "可以手动在电脑上打开控制台页，那里有完整的麦克风引导。";
    box.append(t, d);
    micSteps.appendChild(box);
    const re = document.createElement("button");
    re.textContent = "重新检测";
    re.style.cssText = "height:42px;border-radius:11px;font:inherit;font-size:14px;"
      + "background:#1b2029;color:#8ab4f8;border:1px solid #2a3140;cursor:pointer";
    re.addEventListener("click", micPrepare);
    micSteps.appendChild(re);
  });

  // ── 采集与传输 ──
  async function micStart() {
    micBtnTxt.textContent = "正在启动…";
    micSetReady(false);
    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
      if (audioCtx.state === "suspended") await audioCtx.resume();
      await audioCtx.audioWorklet.addModule("/mic-worklet.js");

      const src = audioCtx.createMediaStreamSource(micStream);
      workletNode = new AudioWorkletNode(audioCtx, "mic-chunker");
      // 必须接上 destination 才会跑：用 0 增益的哑接（不然自己听自己，啸叫）
      const silent = audioCtx.createGain();
      silent.gain.value = 0;
      src.connect(workletNode);
      workletNode.connect(silent);
      silent.connect(audioCtx.destination);

      const r = await api("/api/mic/start", {}, "POST");
      if (!r || !r.ok) throw new Error((r && r.error) || "电脑端尚未就绪");
      if (audioCtx.sampleRate !== 48000) {
        micNote.textContent = "注意：设备的采样率是 " + audioCtx.sampleRate
          + "Hz，音调可能略有偏差。";
      }

      workletNode.port.onmessage = micOnChunk;
      recording = true;
      micBtn.classList.add("on");
      micBtnTxt.textContent = "停止";
      micState.textContent = "正在采集";
      micNote.textContent = "音频正在传输至电脑。请保持本页面在前台，"
        + "并在电脑的会议、游戏或直播软件中选择该虚拟麦克风。";
    } catch (e) {
      micSub.textContent = "启动失败：" + (e && e.message ? e.message : e);
      await micTeardown(false);
    } finally {
      micSetReady(!recording ? true : true);
      micBtn.setAttribute("aria-disabled", recording ? "false" : "true");
    }
  }

  async function micOnChunk(ev) {
    const pcm = ev.data; // Int16Array
    if (!recording || sending >= 2) return; // 堆积就丢块，宁可丢也不能越攒越久
    sending++;
    try {
      await fetch("/api/mic/audio", {
        method: "POST",
        headers: { Authorization: "Bearer " + token, "Content-Type": "application/octet-stream" },
        body: pcm.buffer,
      });
    } catch (e) { /* 断一下不影响，下一块继续 */ }
    sending--;

    // 电平表（用 PCM 自己算 RMS，省一个 AnalyserNode）
    let sum = 0;
    for (let i = 0; i < pcm.length; i += 8) { const v = pcm[i] / 32768; sum += v * v; }
    const rms = Math.sqrt(sum / (pcm.length / 8 || 1));
    meterBar.style.width = Math.min(100, Math.round(rms * 260)) + "%";
  }

  async function micTeardown(tellServer = true) {
    recording = false;
    micBtn.classList.remove("on");
    micBtnTxt.textContent = "开始";
    meterBar.style.width = "0%";
    try { if (workletNode) workletNode.port.onmessage = null; } catch (e) {}
    try { if (micStream) micStream.getTracks().forEach((t) => t.stop()); } catch (e) {}
    try { if (audioCtx) await audioCtx.close(); } catch (e) {}
    workletNode = null; micStream = null; audioCtx = null;
    if (tellServer) {
      let r = null;
      try { r = await api("/api/mic/stop", {}, "POST"); } catch (e) {}
      const s = r && r.stat;
      if (s) {
        micSub.textContent = "已停止 · 传输 " + Math.round(s.bytes / 1024) + " KB / "
          + s.chunks + " 块 / " + s.seconds + " 秒";
      }
    }
  }
  function micStopQuiet() { if (recording) micTeardown(true); }

  micBtn.addEventListener("click", async () => {
    if (recording) {
      await micTeardown(true);
      micState.textContent = "已停止";
      return;
    }
    if (!micReady) { micPrepare(); return; }
    await micStart();
  });

  // 页面被切走/关掉时，尽量把麦关掉（手机端后台会暂停录音，两边状态别不一致）
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && recording) {
      micTeardown(true);
      micState.textContent = "页面已切至后台，采集暂停";
      micNote.textContent = "返回本页面后，点击「开始」继续。";
    }
  });

    loadEndpoints();
    if (wantTab === "mic") showTab("mic");
  })();
})();
</script>
</body>
</html>
