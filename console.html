<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>语音键盘 · 控制台</title>
<style>
  :root{
    --bg:#0f1115; --surface:#171b23; --surface2:#1e2330; --border:#242a36;
    --text:#e8eaf0; --muted:#8b94a7; --accent:#4c8dff; --ok:#3ddc84; --err:#ff5f56;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--text);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:32px 20px;
  }
  .wrap{width:100%;max-width:820px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  h1{font-size:18px;margin:0;font-weight:650;letter-spacing:.2px}
  .pill{
    margin-left:auto;font-size:12.5px;padding:5px 12px;border-radius:20px;
    background:var(--surface);border:1px solid var(--border);color:var(--muted);
  }
  .pill.on{color:var(--ok);border-color:#204a35;background:#12211b}
  .pill.off{color:var(--err);border-color:#4a2024;background:#211316}

  /* 按钮 */
  .row-btns{display:flex;gap:8px;margin-top:14px}
  .row-btns button{
    flex:1 1 0;height:38px;border-radius:10px;cursor:pointer;font:inherit;font-size:13.5px;
    background:var(--surface2);color:var(--text);border:1px solid var(--border);
    transition:.15s;
  }
  .row-btns button:hover{border-color:#31405c}
  .row-btns button.danger{color:#ffb3ae;border-color:#4a2024;background:#211316}
  .row-btns button.danger:hover{border-color:#5c2a2f}

  main{
    display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start;
  }
  @media(max-width:700px){ main{grid-template-columns:1fr} }

  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px}

  .qbox{background:#fff;border-radius:12px;padding:14px;line-height:0;min-height:150px;
    display:flex;align-items:center;justify-content:center}
  .qbox svg{width:100%;height:auto;display:block}
  .qbox .none{color:#999;font-size:13px;line-height:1.5;text-align:center;font-family:inherit}
  .qr p{margin:14px 0 8px;color:var(--muted);font-size:13px;text-align:center}
  .qr code{
    display:block;background:var(--surface2);border:1px solid var(--border);
    padding:9px 12px;border-radius:10px;font-size:12.5px;color:#8ab4f8;
    text-align:center;word-break:break-all;
  }

  dl{margin:0 0 4px;display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:14px}
  dt{color:var(--muted)}
  dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
  dd.eps{text-align:right;font-size:12.5px;color:#8ab4f8;word-break:break-all}
  .upd{margin:10px 0 0;font-size:12.5px;color:var(--muted);min-height:1em;text-align:right}
  .upd a{color:#8ab4f8}
  .upd.new{color:#7ee2a8}

  .sw{display:flex;align-items:center;gap:10px;margin:18px 0 4px;
      padding-top:16px;border-top:1px solid var(--border);cursor:pointer;user-select:none;font-size:14px}
  .sw input{appearance:none;width:38px;height:22px;border-radius:11px;background:#333b4a;
    position:relative;cursor:pointer;transition:.16s;flex:0 0 auto;margin:0}
  .sw input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;
    border-radius:50%;background:#8b94a7;transition:.16s}
  .sw input:checked{background:var(--accent)}
  .sw input:checked::after{left:19px;background:#fff}

  .mic{margin:0 0 4px}
  .mic-row{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;line-height:1.6}
  .mic-dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:#8b94a7;margin-top:6px}
  .mic-dot.ok{background:#22c55e}
  .mic-dot.bad{background:#ef4444}
  .mic-btns{display:flex;gap:8px;margin-top:12px}
  .mic-btns button{
    flex:1 1 0;height:34px;border-radius:9px;cursor:pointer;font:inherit;font-size:13px;
    background:var(--surface2);color:var(--text);border:1px solid var(--border);
  }
  .mic-btns button:hover{border-color:#31405c}
  .mic-qr{margin-top:14px;text-align:center}
  .mic-qr p{margin:0 0 10px;font-size:12.5px;color:var(--muted)}
  .mic-qr img{width:180px;height:180px;background:#fff;border-radius:10px;padding:8px}
  .mic-steps{margin-top:14px;display:flex;flex-direction:column;gap:10px}
  .mstep{background:#161b23;border:1px solid #2a3140;border-radius:12px;padding:12px}
  .mstep .st{font-size:13px;font-weight:600;margin-bottom:5px}
  .mstep .sd{font-size:12.5px;color:var(--muted);line-height:1.6}
  .mstep code{display:block;margin-top:7px;background:#0f1319;border:1px solid #2a3140;border-radius:7px;
    padding:7px 9px;font-size:12px;color:#8ab4f8;word-break:break-all}
  .mstep .sact{margin-top:9px;display:flex;gap:8px}
  .mstep .sact button,.mstep .sact a{
    flex:1 1 0;height:34px;border-radius:9px;font:inherit;font-size:13px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;text-decoration:none;
    background:var(--accent);color:#fff;border:0;
  }
  .mstep.done{opacity:.55}
  .hide{display:none !important}

  h3{font-size:13px;color:var(--muted);font-weight:600;margin:20px 0 10px;
     text-transform:uppercase;letter-spacing:.6px}
  ul{list-style:none;margin:0;padding:0;font-size:13.5px;max-height:230px;overflow-y:auto}
  li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #1e2330}
  li:last-child{border-bottom:0}
  li .t{color:var(--muted);font-size:12px;flex:0 0 auto;font-variant-numeric:tabular-nums}
  li .x{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  li .n{color:var(--muted);font-size:12px;flex:0 0 auto}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>语音键盘 · 电脑端</h1>
    <span class="pill" id="state">连接中…</span>
  </header>

  <main>
    <section class="card qr">
      <div class="qbox">{{QR_SVG}}</div>
      <p>手机扫码即可使用</p>
      <code>{{PAIR_URL}}</code>
    </section>

    <section class="card">
      <dl>
        <dt>配对 PIN</dt><dd id="pin">—</dd>
        <dt>注入模式</dt><dd id="mode">—</dd>
        <dt>已配对设备</dt><dd id="clients">—</dd>
        <dt>访问地址</dt><dd class="eps" id="eps">—</dd>
        <dt>版本</dt><dd id="ver">—</dd>
      </dl>
      <p class="upd" id="upd"></p>

      <label class="sw"><input type="checkbox" id="enter"> 发送后自动回车（手机端发完自动敲回车）</label>
      <h3>麦克风模式</h3>
      <div class="mic">
        <div class="mic-row">
          <span class="mic-dot" id="mic-dot"></span>
          <span id="mic-why">检测中…</span>
        </div>
        <div class="mic-btns">
          <button id="mic-recheck">重新检测</button>
          <button id="mic-open">查看引导</button>
        </div>
        <div class="mic-qr hide" id="mic-qr">
          <p>手机请改用下面的地址扫描（HTTPS）：</p>
          <img id="mic-qr-img" alt="HTTPS 配对二维码">
        </div>
        <div class="mic-steps hide" id="mic-steps"></div>
      </div>

      <div class="row-btns">
        <button id="copy">复制配对链接</button>
        <button id="chk">检查更新</button>
        <button id="stop" class="danger">停止服务</button>
      </div>
    </section>
  </main>
</div>

<script>
(function () {
  "use strict";
  const $ = (s) => document.querySelector(s);


  function esc(s) {
    return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  async function poll() {
    try {
      const r = await fetch("/api/status");
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();

      $("#state").className = "pill on";
      $("#state").textContent = "运行中";
      $("#mode").textContent = j.mode;
      $("#pin").textContent = j.pin || "已关闭";
      $("#clients").textContent = j.clients + " 台";
      $("#eps").innerHTML = (j.endpoints || []).map(esc).join("<br>") || "—";
      $("#ver").textContent = j.version ? "v" + j.version : "—";
      $("#enter").checked = !!j.allow_enter;
    } catch (e) {
      $("#state").className = "pill off";
      $("#state").textContent = "已停止";
    }
  }


  // ── 麦克风模式（引导在电脑端，因为装驱动是电脑上的活）────────────
  const micDot = $("#mic-dot"), micWhy = $("#mic-why");
  const micSteps = $("#mic-steps"), micQr = $("#mic-qr"), micQrImg = $("#mic-qr-img");

  function micSay(ok, text) {
    micDot.className = "mic-dot " + (ok === true ? "ok" : ok === false ? "bad" : "");
    micWhy.textContent = text;
  }

  async function micRefresh() {
    let st = null;
    try { st = await (await fetch("/api/mic/status")).json(); } catch (e) {}
    if (!st) { micSay(false, "取不到状态（服务可能已停止）"); return; }

    if (st.ok && st.tls) {
      micSay(true, "已就绪 —— 设备：" + (st.device || "虚拟麦克风")
        + "。手机端切到「麦克风」标签即可开始。");
      micQr.classList.add("hide");
      micSteps.classList.add("hide");
      return;
    }
    if (st.ok && !st.tls) {
      micSay(null, "虚拟设备已就绪，但还没有 HTTPS 证书 —— 浏览器只在 https 下才允许网页使用麦克风。"
        + "点「查看引导」按第 1 步生成证书。");
      micSteps.classList.add("hide");
      return;
    }
    micSay(false, st.reason || "还未就绪");
  }

  async function micOpenGuide() {
    micSteps.classList.remove("hide");
    micSteps.innerHTML = '<div class="mstep"><div class="st">正在获取引导…</div></div>';
    let g = null;
    try { g = await (await fetch("/api/mic/guide")).json(); } catch (e) {}
    if (!g || !g.steps) {
      micSteps.innerHTML = '<div class="mstep"><div class="st">无法获取引导</div>'
        + '<div class="sd">请刷新页面后重试。</div></div>';
      return;
    }
    micSteps.innerHTML = "";
    g.steps.forEach((st, i) => micStep(st, i + 1));
    await micRefresh();
  }

  function micStep(st, n) {
    const d = document.createElement("div");
    d.className = "mstep";
    const t = document.createElement("div");
    t.className = "st";
    t.textContent = n + ". " + (st.title || "");
    const sd = document.createElement("div");
    sd.className = "sd";
    sd.textContent = st.detail || "";
    d.append(t, sd);

    if (st.command) {
      const c = document.createElement("code");
      c.textContent = st.command;
      d.appendChild(c);
    }
    const act = document.createElement("div");
    act.className = "sact";

    if (st.url) {
      const a = document.createElement("a");
      a.href = st.url;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "打开下载页面";
      act.appendChild(a);
    }

    if (st.action === "enable_tls") {
      const b = document.createElement("button");
      b.textContent = "生成证书并切换到 HTTPS";
      b.addEventListener("click", async () => {
        b.disabled = true;
        b.textContent = "正在生成…";
        let r = null;
        try { r = await (await fetch("/api/tls/enable", { method: "POST" })).json(); } catch (e) {}
        if (r && r.ok) {
          d.classList.add("done");
          b.textContent = "已切换 ✓";
          // 换成 https 之后手机要重新配对（协议变了，localStorage 不同源），
          // 所以直接把新的配对二维码显示出来，手机扫一下就行
          micQrImg.src = "/api/qr.svg?t=" + Date.now();
          micQr.classList.remove("hide");
          micSay(true, "证书已生成，服务已切换到 HTTPS，页面地址也变成了 https://。"
            + "手机请扫描下方二维码重新配对。");
        } else {
          b.disabled = false;
          b.textContent = "重试";
          micSay(false, (r && r.error) || "生成失败");
        }
      });
      act.appendChild(b);
    }

    if (st.action === "setup_mic") {
      const b = document.createElement("button");
      b.textContent = "一键创建虚拟麦克风";
      b.addEventListener("click", async () => {
        b.disabled = true;
        b.textContent = "正在创建…";
        let r = null;
        try { r = await (await fetch("/api/mic/setup", { method: "POST" })).json(); } catch (e) {}
        if (r && r.ok) {
          d.classList.add("done");
          b.textContent = "已创建 ✓";
          micRefresh();
        } else {
          b.disabled = false;
          b.textContent = "重试";
          micSay(false, (r && r.error) || "创建失败");
        }
      });
      act.appendChild(b);
    }

    if (act.children.length) d.appendChild(act);
    micSteps.appendChild(d);
  }

  $("#mic-recheck").addEventListener("click", micRefresh);
  $("#mic-open").addEventListener("click", micOpenGuide);

  // 手机端点了「在电脑上打开引导」→ 这里会带 ?mic=1 打开，直接展开引导
  micRefresh();
  if (new URLSearchParams(location.search).get("mic") === "1") {
    micOpenGuide();
  }

  $("#enter").addEventListener("change", async (ev) => {
    try {
      await fetch("/api/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ allow_enter: ev.target.checked }),
      });
    } catch (e) { /* 下次轮询会纠正 */ }
    poll();
  });

  // 复制配对链接 / 停止服务——都在本机页面上，直接打本机接口
  // ── 检查更新 ────────────────────────────────────────────────
  // 刻意让浏览器去问 GitHub API（api.github.com 允许跨域），而不是程序自己发请求：
  // 二进制不长胖，程序也仍然"不发起任何出站连接"。只有点按钮才会查一次。
  const REPO = "talongao/voice-keyboard";
  const REL_URL = "https://github.com/" + REPO + "/releases/latest";

  function cmpVer(a, b) {
    const A = String(a).replace(/^v/, "").split(".").map(Number);
    const B = String(b).replace(/^v/, "").split(".").map(Number);
    for (let i = 0; i < Math.max(A.length, B.length); i++) {
      const x = A[i] || 0, y = B[i] || 0;
      if (x !== y) return x - y;
    }
    return 0;
  }

  async function checkUpdate() {
    const out = $("#upd");
    const cur = ($("#ver").textContent || "").replace(/^v/, "");
    out.className = "upd";
    out.textContent = "正在检查…";
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 8000);
    try {
      const r = await fetch("https://api.github.com/repos/" + REPO + "/releases/latest", {
        headers: { Accept: "application/vnd.github+json" },
        signal: ctl.signal,
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      const latest = String(j.tag_name || "").replace(/^v/, "");
      if (!latest) throw new Error("没有版本号");
      if (cmpVer(latest, cur) > 0) {
        out.className = "upd new";
        out.innerHTML =
          "有新版本 v" + esc(latest) + ' · <a href="' + REL_URL +
          '" target="_blank" rel="noopener">前往下载</a>';
      } else {
        out.textContent = "已是最新（v" + esc(cur) + "）";
      }
    } catch (e) {
      out.textContent = "检查失败（无法访问网络或 GitHub）";
    } finally {
      clearTimeout(timer);
    }
  }

  $("#chk").addEventListener("click", checkUpdate);

  $("#copy").addEventListener("click", async () => {
    const url = "{{PAIR_URL}}";
    try {
      await navigator.clipboard.writeText(url);
      $("#copy").textContent = "已复制 ✓";
      setTimeout(() => ($("#copy").textContent = "复制配对链接"), 1500);
    } catch (e) {
      $("#copy").textContent = "复制失败，手动选上面那行";
    }
  });
  $("#stop").addEventListener("click", async () => {
    $("#stop").textContent = "正在停止…";
    try { await fetch("/api/shutdown", { method: "POST" }); } catch (e) {}
    setTimeout(poll, 500);
  });

  poll();
  setInterval(poll, 2000);
})();
</script>
</body>
</html>
